<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestione Categorie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

    <h1>🏷️ Gestione Categorie</h1>
    
    <a th:href="@{/}" class="btn btn-info mb-4"> &larr; Torna all'Inventario Prodotti</a>
    
    <hr>
    
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        [[${successMessage}]]
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        [[${errorMessage}]]
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    
    <div class="row">
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header">
                    <h5 th:if="${nuovaCategoria.id == 0}">➕ Aggiungi Nuova Categoria</h5>
                    <h5 th:if="${nuovaCategoria.id != 0}">✏️ Modifica Categoria #[[${nuovaCategoria.id}]]</h5>
                </div>
                <div class="card-body">
                    
                    <form th:action="@{/categorie/salva}" method="post" th:object="${nuovaCategoria}">
                        
                        <input type="hidden" th:field="*{id}" />
                        
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome Categoria:</label>
                            <input type="text" id="nome" th:field="*{nome}" class="form-control" 
                                   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">
                                Errore Nome
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary">Salva Categoria</button>
                        <a th:if="${nuovaCategoria.id != 0}" th:href="@{/categorie}" class="btn btn-secondary">Annulla Modifica</a>
                    </form>
                    
                </div>
            </div>
        </div>
    </div>

    <h2>Elenco Categorie</h2>
    
    <table class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Azioni</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="categoria : ${listaCategorie}">
                <td th:text="${categoria.id}">1</td>
                <td th:text="${categoria.nome}">Nome Esempio</td>
                <td>
                    <a th:href="@{/categorie/modifica/{id}(id=${categoria.id})}" class="btn btn-warning btn-sm">Modifica</a>
                    <a th:href="@{/categorie/elimina/{id}(id=${categoria.id})}" class="btn btn-danger btn-sm" 
                       onclick="return confirm('Sei sicuro di voler eliminare questa categoria?');">Elimina</a>
                </td>
            </tr>
        </tbody>
    </table>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
